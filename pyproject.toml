[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legopartlocator"
version = "0.1.0"
description = "Scan a LEGO instruction PDF and map each part to the bag/page it belongs to."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "legooartlocator" }]
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.5",
    "click>=8.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Heavy, optional: local image-embedding part matcher (no paid API).
ml = ["torch>=2.0", "open-clip-torch>=2.20", "pillow>=10.0"]

[project.scripts]
lpl = "legopartlocator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
