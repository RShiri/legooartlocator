[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legopartlocator"
version = "0.1.0"
description = "Scan a LEGO instruction PDF and map each part to the bag/page it belongs to."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "legooartlocator" }]
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.5",
    "click>=8.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local page detection (callout/bag/quantity) — no paid API. Needs the Tesseract
# binary installed separately for OCR.
local = ["opencv-python-headless>=4.8", "pytesseract>=0.3.10", "pillow>=10.0"]
# Heavy, optional: local image-embedding part matcher (no paid API).
ml = ["torch>=2.0", "open-clip-torch>=2.20", "pillow>=10.0"]
# Heavier still: train our own local part-embedding model (`lpl train-embedding`),
# no paid API. torch-directml gives real GPU acceleration on Windows for
# non-CUDA cards (AMD/Intel); harmless no-op to install on other platforms
# where it isn't needed, since training just falls back to CPU/CUDA. Capped
# to Python <3.13: torch-directml only ships wheels for 3.8-3.12 (checked
# against PyPI directly) -- on newer interpreters training silently runs on
# CPU instead, which is why `python_version` is part of the marker and not
# just `sys_platform`.
train = ["torch>=2.0", "torchvision>=0.15", "pillow>=10.0", "torch-directml>=0.2; sys_platform == 'win32' and python_version < '3.13'"]

[project.scripts]
lpl = "legopartlocator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
