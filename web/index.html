<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LEGO Part Locator</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a; --fg: #e7eaf0;
    --muted: #9aa3b2; --accent: #ffcf33; --ok: #4caf50; --bad: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --border:#e2e5ea; --fg:#1c2029; --muted:#6b7280; --accent:#d99e00; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 20px; border-bottom:1px solid var(--border); display:flex;
           flex-wrap:wrap; gap:12px 20px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header .meta { color:var(--muted); font-size:13px; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  input[type=search], select {
    background:var(--panel); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px; font-size:14px;
  }
  input[type=search] { flex:1 1 260px; }
  .hint { color:var(--muted); font-size:13px; margin:8px 0 14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
  tr:hover td { background:rgba(127,127,127,0.06); }
  .thumb { width:44px; height:44px; object-fit:contain; background:#fff2; border-radius:6px; }
  .bag { display:inline-block; min-width:22px; text-align:center; background:var(--accent);
         color:#000; border-radius:6px; padding:2px 7px; font-weight:700; margin:1px; font-size:12px; }
  .pages { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .pill { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:40px; text-align:center; color:var(--muted); }
  #drop.hi { border-color:var(--accent); color:var(--fg); }
  .count { color:var(--muted); font-size:13px; margin-bottom:8px; }
  code { background:var(--panel); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>🧱 LEGO Part Locator</h1>
  <span class="meta" id="setMeta"></span>
</header>
<div class="wrap">
  <div id="loader">
    <div id="drop">
      <p><strong>Drop <code>result.json</code> here</strong> or
        <label style="color:var(--accent);cursor:pointer;text-decoration:underline">
          browse<input id="file" type="file" accept="application/json" hidden></label>.
      </p>
      <p class="hint">Generated by <code>lpl scan set.pdf --set 76307</code>.
         Tip: serve this folder and it will auto-load a sibling <code>result.json</code>.</p>
    </div>
  </div>

  <div id="app" hidden>
    <div class="controls">
      <input id="q" type="search" placeholder="Search part name, colour, element id, or part number…" />
      <select id="bagFilter"><option value="">All bags</option></select>
      <select id="statusFilter">
        <option value="">Any status</option>
        <option value="ok">Count reconciled ✓</option>
        <option value="bad">Count mismatch ✕</option>
        <option value="vision">Vision-only</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <table>
      <thead><tr>
        <th data-k="img"></th>
        <th data-k="name">Part</th>
        <th data-k="color_name">Colour</th>
        <th data-k="bags">Bag(s)</th>
        <th data-k="pages">Pages</th>
        <th data-k="total_seen">Seen</th>
        <th data-k="inventory_qty">Inv</th>
        <th data-k="confidence">Conf</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
let DATA = null;
let sortKey = "bags", sortDir = 1;

function h(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function load(data){
  DATA = data;
  document.getElementById("loader").hidden = true;
  document.getElementById("app").hidden = false;
  const meta = [data.set_name, data.set_num && ("#"+data.set_num),
    (data.parts?.length||0)+" parts", (data.reconciled?"reconciled":"vision-only")]
    .filter(Boolean).join(" · ");
  document.getElementById("setMeta").textContent = meta;
  const bags = [...new Set((data.parts||[]).flatMap(p=>p.bags||[]))].sort((a,b)=>a-b);
  const bf = document.getElementById("bagFilter");
  bags.forEach(b => { const o=document.createElement("option"); o.value=b; o.textContent="Bag "+b; bf.appendChild(o); });
  render();
}

function statusOf(p){
  if(!p.reconciled) return "vision";
  return p.count_matches ? "ok" : "bad";
}

function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const bag = document.getElementById("bagFilter").value;
  const st = document.getElementById("statusFilter").value;
  let rows = (DATA.parts||[]).filter(p => {
    if(bag && !(p.bags||[]).includes(+bag)) return false;
    if(st && statusOf(p)!==st) return false;
    if(!q) return true;
    return [p.name,p.color_name,p.element_id,p.part_num].some(v => (v||"").toLowerCase().includes(q));
  });
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(Array.isArray(x)) x=x[0]??-1; if(Array.isArray(y)) y=y[0]??-1;
    if(x==null)x=-Infinity; if(y==null)y=-Infinity;
    return (x>y?1:x<y?-1:0)*sortDir;
  });
  document.getElementById("count").textContent = rows.length+" part(s) shown";
  document.getElementById("rows").innerHTML = rows.map(p => {
    const bags = (p.bags||[]).map(b=>`<span class="bag">${b}</span>`).join("");
    const pages = (p.pages||[]).map(x=>x+1).join(", ");
    const stc = statusOf(p);
    const inv = p.inventory_qty==null ? "—"
      : `<span class="${stc==='ok'?'ok':stc==='bad'?'bad':''}">${p.inventory_qty}</span>`;
    const img = p.image_url ? `<img class="thumb" src="${h(p.image_url)}" loading="lazy" alt="">` : "";
    return `<tr>
      <td>${img}</td>
      <td>${h(p.name)||"<span class='pill'>unknown</span>"}${p.part_num?` <span class="pill">${h(p.part_num)}</span>`:""}</td>
      <td>${h(p.color_name)}</td>
      <td>${bags}</td>
      <td class="pages">${pages}</td>
      <td>${p.total_seen??""}</td>
      <td>${inv}</td>
      <td>${(p.confidence??0).toFixed(2)}</td>
    </tr>`;
  }).join("");
}

document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", ()=>{
  const k=th.dataset.k; if(!k) return;
  if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
  render();
}));
["q","bagFilter","statusFilter"].forEach(id=>document.getElementById(id).addEventListener("input",render));

// File input + drag/drop
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(f) f.text().then(t=>load(JSON.parse(t)));
});
const drop=document.getElementById("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hi");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hi");}));
drop.addEventListener("drop",e=>{
  const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>load(JSON.parse(t)));
});

// Auto-load a sibling result.json when served over http(s).
if(location.protocol.startsWith("http")){
  fetch("result.json").then(r=>r.ok?r.json():null).then(d=>{ if(d) load(d); }).catch(()=>{});
}
</script>
</body>
</html>
