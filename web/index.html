<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LEGO Part Locator</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a; --fg: #e7eaf0;
    --muted: #9aa3b2; --accent: #ffcf33; --ok: #4caf50; --bad: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --border:#e2e5ea; --fg:#1c2029; --muted:#6b7280; --accent:#d99e00; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 20px; border-bottom:1px solid var(--border); display:flex;
           flex-wrap:wrap; gap:12px 20px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header .meta { color:var(--muted); font-size:13px; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  input[type=search], select {
    background:var(--panel); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px; font-size:14px;
  }
  input[type=search] { flex:1 1 260px; }
  .hint { color:var(--muted); font-size:13px; margin:8px 0 14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
  tr:hover td { background:rgba(127,127,127,0.06); }
  .thumb { width:44px; height:44px; object-fit:contain; background:#fff2; border-radius:6px; }
  .bag { display:inline-block; min-width:22px; text-align:center; background:var(--accent);
         color:#000; border-radius:6px; padding:2px 7px; font-weight:700; margin:1px; font-size:12px; }
  .pages { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .pill { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:40px; text-align:center; color:var(--muted); }
  #drop.hi { border-color:var(--accent); color:var(--fg); }
  .count { color:var(--muted); font-size:13px; margin-bottom:8px; }
  code { background:var(--panel); padding:1px 5px; border-radius:5px; }

  #warningsPanel { border-bottom:1px solid var(--border); background:rgba(217,158,0,0.08); }
  #warningsPanel summary { padding:10px 20px; cursor:pointer; color:var(--accent);
    font-weight:600; list-style:none; display:flex; align-items:center; gap:8px; font-size:14px; }
  #warningsPanel summary::-webkit-details-marker { display:none; }
  #warningsPanel .badge { background:var(--accent); color:#000; border-radius:999px;
    padding:1px 8px; font-size:12px; font-weight:700; }
  #warningsPanel ul { margin:0; padding:2px 20px 14px 42px; color:var(--fg); font-size:13px; }
  #warningsPanel li { margin:4px 0; }

  .bagRow { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .bagCard { flex:0 0 auto; min-width:110px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; cursor:pointer; }
  .bagCard:hover { border-color:var(--accent); }
  .bagCard.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .bagCard .bagTitle { font-weight:700; font-size:14px; }
  .bagCard .bagPages { color:var(--muted); font-size:12px; margin:2px 0 6px; white-space:nowrap; }
  .bagCard .bagStats { font-size:12px; display:flex; gap:8px; white-space:nowrap; }
  .bagCard .bagMismatch { color:var(--bad); font-weight:600; }

  tr.bad-row td { background:rgba(255,107,107,0.09); }
  tr.bad-row:hover td { background:rgba(255,107,107,0.16); }
  tr[data-idx] { cursor:pointer; }
  tr.subrow td { background:var(--panel); padding:8px 10px 12px 40px; }
  .occTable { width:100%; border-collapse:collapse; font-size:13px; }
  .occTable th, .occTable td { padding:5px 10px; border-bottom:1px solid var(--border); }
  .occTable th { color:var(--muted); font-weight:600; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>🧱 LEGO Part Locator</h1>
  <span class="meta" id="setMeta"></span>
</header>
<details id="warningsPanel" hidden>
  <summary>Warnings <span class="badge" id="warnCount">0</span></summary>
  <ul id="warnList"></ul>
</details>
<div class="wrap">
  <div id="loader">
    <div id="drop">
      <p><strong>Drop <code>result.json</code> here</strong> or
        <label style="color:var(--accent);cursor:pointer;text-decoration:underline">
          browse<input id="file" type="file" accept="application/json" hidden></label>.
      </p>
      <p class="hint">Generated by <code>lpl scan set.pdf --set 76307</code>.
         Tip: serve this folder and it will auto-load a sibling <code>result.json</code>.</p>
    </div>
  </div>

  <div id="app" hidden>
    <div class="bagRow" id="bagCards" hidden></div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search part name, colour, element id, or part number…" />
      <select id="bagFilter"><option value="">All bags</option></select>
      <select id="statusFilter">
        <option value="">Any status</option>
        <option value="ok">Count reconciled ✓</option>
        <option value="bad">Count mismatch ✕</option>
        <option value="vision">Vision-only</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <table>
      <thead><tr>
        <th data-k="img"></th>
        <th data-k="name">Part</th>
        <th data-k="color_name">Colour</th>
        <th data-k="bags">Bag(s)</th>
        <th data-k="pages">Pages</th>
        <th data-k="total_seen">Seen</th>
        <th data-k="inventory_qty">Inv</th>
        <th data-k="confidence">Conf</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
let DATA = null;
let sortKey = "bags", sortDir = 1;
let shownParts = [];

function h(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function load(data){
  DATA = data;
  document.getElementById("loader").hidden = true;
  document.getElementById("app").hidden = false;
  const meta = [data.set_name, data.set_num && ("#"+data.set_num),
    (data.parts?.length||0)+" parts",
    data.num_pages!=null ? data.num_pages+" pages" : null,
    (data.reconciled?"reconciled":"vision-only")]
    .filter(Boolean).join(" · ");
  document.getElementById("setMeta").textContent = meta;
  const metaBags = (data.bags||[]).map(b=>b.bag);
  const partBags = (data.parts||[]).flatMap(p=>p.bags||[]);
  const bags = [...new Set([...partBags, ...metaBags])].sort((a,b)=>a-b);
  const bf = document.getElementById("bagFilter");
  bags.forEach(b => { const o=document.createElement("option"); o.value=b; o.textContent=(b===0?"Intro":"Bag "+b); bf.appendChild(o); });
  renderWarnings(data.warnings);
  renderBagCards(data);
  render();
}

function statusOf(p){
  if(!p.reconciled) return "vision";
  return p.count_matches ? "ok" : "bad";
}

function renderWarnings(warnings){
  const panel = document.getElementById("warningsPanel");
  const list = document.getElementById("warnList");
  const count = document.getElementById("warnCount");
  if(!warnings || !warnings.length){
    panel.hidden = true; panel.open = false; list.innerHTML = ""; count.textContent = "0";
    return;
  }
  panel.hidden = false;
  count.textContent = String(warnings.length);
  list.innerHTML = warnings.map(w => `<li>${h(w)}</li>`).join("");
}

function renderBagCards(data){
  const row = document.getElementById("bagCards");
  const bagsMeta = data.bags || [];
  if(!bagsMeta.length){ row.hidden = true; row.innerHTML = ""; return; }
  row.hidden = false;
  const parts = data.parts || [];
  row.innerHTML = bagsMeta.map(b => {
    const n = b.bag;
    const label = n===0 ? "Intro" : "Bag "+n;
    const startP = (b.start_page??0)+1, endP = (b.end_page??b.start_page??0)+1;
    const pagesLabel = startP===endP ? `page ${startP}` : `pages ${startP}–${endP}`;
    const inBag = parts.filter(p => (p.bags||[]).includes(n));
    const mismatches = inBag.filter(p => statusOf(p)==="bad").length;
    return `<div class="bagCard" data-bag="${n}">
      <div class="bagTitle">${h(label)}</div>
      <div class="bagPages">${h(pagesLabel)}</div>
      <div class="bagStats"><span>${inBag.length} part(s)</span>${mismatches?`<span class="bagMismatch">${mismatches} mismatch</span>`:""}</div>
    </div>`;
  }).join("");
  row.querySelectorAll(".bagCard").forEach(card => card.addEventListener("click", ()=>{
    const n = card.dataset.bag;
    const bf = document.getElementById("bagFilter");
    bf.value = (bf.value === n) ? "" : n;
    render();
  }));
  updateBagCardActive();
}

function updateBagCardActive(){
  const bag = document.getElementById("bagFilter").value;
  document.querySelectorAll(".bagCard").forEach(card => {
    card.classList.toggle("active", bag !== "" && card.dataset.bag === bag);
  });
}

function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const bag = document.getElementById("bagFilter").value;
  const st = document.getElementById("statusFilter").value;
  let rows = (DATA.parts||[]).filter(p => {
    if(bag && !(p.bags||[]).includes(+bag)) return false;
    if(st && statusOf(p)!==st) return false;
    if(!q) return true;
    return [p.name,p.color_name,p.element_id,p.part_num].some(v => (v||"").toLowerCase().includes(q));
  });
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(Array.isArray(x)) x=x[0]??-1; if(Array.isArray(y)) y=y[0]??-1;
    if(x==null)x=-Infinity; if(y==null)y=-Infinity;
    return (x>y?1:x<y?-1:0)*sortDir;
  });
  shownParts = rows;
  document.getElementById("count").textContent = rows.length+" part(s) shown";
  document.getElementById("rows").innerHTML = rows.map((p,i) => {
    const bags = (p.bags||[]).map(b=>`<span class="bag">${b}</span>`).join("");
    const pages = (p.pages||[]).map(x=>x+1).join(", ");
    const stc = statusOf(p);
    let inv = "—";
    if(p.inventory_qty!=null){
      const invCls = stc==='ok'?'ok':stc==='bad'?'bad':'';
      let delta = "";
      if(stc==='bad' && p.total_seen!=null){
        const d = p.total_seen - p.inventory_qty;
        const sign = d<0 ? "−"+Math.abs(d) : "+"+d;
        delta = ` <span class="pages">(${sign} seen)</span>`;
      }
      inv = `<span class="${invCls}">${h(p.inventory_qty)}</span>${delta}`;
    }
    const img = p.image_url ? `<img class="thumb" src="${h(p.image_url)}" loading="lazy" alt="">` : "";
    const rowCls = stc==='bad' ? ' class="bad-row"' : '';
    return `<tr data-idx="${i}"${rowCls}>
      <td>${img}</td>
      <td>${h(p.name)||"<span class='pill'>unknown</span>"}${p.part_num?` <span class="pill">${h(p.part_num)}</span>`:""}</td>
      <td>${h(p.color_name)}</td>
      <td>${bags}</td>
      <td class="pages">${pages}</td>
      <td>${p.total_seen??""}</td>
      <td>${inv}</td>
      <td>${(p.confidence??0).toFixed(2)}</td>
    </tr>`;
  }).join("");
  updateBagCardActive();
}

document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", (e)=>{
  e.stopPropagation();
  const k=th.dataset.k; if(!k) return;
  if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
  render();
}));
["q","bagFilter","statusFilter"].forEach(id=>document.getElementById(id).addEventListener("input",render));

// Row expansion: click a part row to reveal its per-occurrence breakdown.
document.getElementById("rows").addEventListener("click", e=>{
  const tr = e.target.closest("tr[data-idx]");
  if(!tr) return;
  const idx = tr.dataset.idx;
  const existing = tr.nextElementSibling;
  const wasOpen = !!(existing && existing.classList.contains("subrow") && existing.dataset.owner===idx);
  document.querySelectorAll("tr.subrow").forEach(el=>el.remove());
  if(wasOpen) return;
  const p = shownParts[+idx];
  if(!p) return;
  const occRows = (p.occurrences||[]).map(o => `<tr>
      <td>${h(o.bag)}</td>
      <td>${h((o.page_index??0)+1)}</td>
      <td>${h(o.quantity)}</td>
    </tr>`).join("");
  const sub = document.createElement("tr");
  sub.className = "subrow";
  sub.dataset.owner = idx;
  sub.innerHTML = `<td colspan="8"><table class="occTable"><thead><tr><th>Bag</th><th>Page</th><th>Qty</th></tr></thead><tbody>${occRows || '<tr><td colspan="3">No occurrences.</td></tr>'}</tbody></table></td>`;
  tr.after(sub);
});

// File input + drag/drop
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(f) f.text().then(t=>load(JSON.parse(t)));
});
const drop=document.getElementById("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hi");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hi");}));
drop.addEventListener("drop",e=>{
  const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>load(JSON.parse(t)));
});

// Auto-load a sibling result.json when served over http(s).
if(location.protocol.startsWith("http")){
  fetch("result.json").then(r=>r.ok?r.json():null).then(d=>{ if(d) load(d); }).catch(()=>{});
}
</script>
</body>
</html>
